name: Validate Project Base Adapter

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/operations/TETRIS_FIRST_PROJECT_ADAPTER_POLICY.json"
      - "docs/operations/TETRIS_RUNTIME_SURFACE_RECOVERY_PROTECTED_CHANGE_APPROVAL.json"
      - "docs/operations/TETRIS_CURRENT_APPROVED_PROTECTED_CHANGE_SET.json"
      - "docs/PROJECT_OPERATING_HEALTH.json"
      - "docs/design/PRODUCTION_CANON_INDEX.json"
      - "docs/design/CHAIN_COMBO_MP_CONTRACT.md"
      - "docs/design/COMBO_RESOLVED_SKILL_CONTRACT.md"
      - "docs/design/PROJECT_WORKSPACE_INDEX.md"
      - "docs/design/REPLANNING_FOUNDATION.md"
      - "docs/design/PRODUCTION_REALTIME_COMBAT_CANON.md"
      - "docs/design/PROJECT_MASTER_GDD.md"
      - "docs/design/RUNTIME_IMAGE_ASSET_CONSUMER_CONTRACT.md"
      - "docs/design/VISUAL_BIBLE.md"
      - "docs/validation/PRODUCTION_VERTICAL_SLICE_HUMAN_EVIDENCE_CONTRACT.md"
      - "skills/**"
      - ".agents/**"
      - "tools/check_workflow_adoption.py"
      - "tools/templates/tetris_workflow_router.md"
      - "tests/tooling/**"
      - "docs/PROJECT_OPERATING_DASHBOARD.html"
      - ".github/workflows/validate-project-base-adapter.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check out pinned Base validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: alsdmlals4-eng/Base
          ref: 23ecad5a3084f97c4e5d1e39a9a6d70d1eeb37ef
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Select the trusted protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ADAPTER_PATH="skills/PROJECT_BASE_ADAPTER.json"
          ADAPTER_CHANGES="$(git diff --name-only "$PR_BASE_SHA"...HEAD -- "$ADAPTER_PATH")"
          if printf '%s\n' "$ADAPTER_CHANGES" | grep -Fxq "$ADAPTER_PATH"; then
            PROTECTED_BASE_SHA="$PR_BASE_SHA"
          else
            PROTECTED_BASE_SHA="$(git show "$PR_BASE_SHA:$ADAPTER_PATH" | python -c 'import json, sys; print(json.load(sys.stdin)["protected_baseline"]["commit"])')"
          fi
          python -c 'import re, sys; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", sys.argv[1]) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PROTECTED_BASE_SHA" "$PR_BASE_SHA"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"

      - name: Validate adapter and approved protected recovery against the trusted baseline
        run: |
          python tools/check_workflow_adoption.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --external-approval true \
            --check

      - name: Verify project adapter and projection regressions
        run: |
          python -m unittest discover -s tests/tooling -p 'test_formal_base_adapter*.py' -v
          python -m unittest discover -s tests/tooling -p test_workflow_adoption.py -v
